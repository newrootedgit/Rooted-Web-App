name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-typecheck:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run ESLint
        run: pnpm lint

      - name: Generate Prisma Client (API)
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
          TIMESCALE_DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
        run: cd apps/api && pnpm exec prisma generate

      - name: Type-check Root/Frontend
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
          TIMESCALE_DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
        run: pnpm exec tsc

      - name: Type-check API
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
          TIMESCALE_DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
        run: cd apps/api && pnpm exec tsc

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Dependency Audit
        run: pnpm audit --audit-level high

  test-api:
    name: Test API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Generate Prisma Client
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
          TIMESCALE_DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
        run: cd apps/api && pnpm exec prisma generate

      - name: Run API Tests
        run: cd apps/api && pnpm test:run

  build-verification:
    name: Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Generate Prisma Client (API)
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
          TIMESCALE_DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
        run: cd apps/api && pnpm exec prisma generate

      - name: Build Frontend
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
          TIMESCALE_DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
        run: pnpm build

      - name: Build API
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
          TIMESCALE_DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
        run: cd apps/api && pnpm build
