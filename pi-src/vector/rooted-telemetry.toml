# Vector configuration for Rooted telemetry pipeline
# Tails the JSONL telemetry log and publishes batches to AWS IoT Core via MQTT

# ---------- Global settings ----------
# data_dir holds the file source's read checkpoints and the disk buffer used by
# the mqtt sink below. Vector does NOT create this path on its own - if it is
# missing it exits immediately with a config error (status 78/CONFIG). The
# deploy scripts create it (mkdir -p /var/lib/vector) before starting the
# service, so the very first start succeeds instead of crash-looping until the
# directory happens to exist.
data_dir = "/var/lib/vector"

# ---------- Source: tail the JSONL log ----------
[sources.telemetry_log]
type = "file"
include = ["/home/rooted/telemetry_log.jsonl"]
read_from = "beginning"
fingerprint.strategy = "device_and_inode"

# ---------- Transform: parse JSON ----------
[transforms.parse_json]
type = "remap"
inputs = ["telemetry_log"]
source = '''
. = parse_json!(.message)
'''

# ---------- Transform: filter incomplete / invalid records ----------
[transforms.filter_valid]
type = "filter"
inputs = ["parse_json"]
condition = '''
includes(["status_update", "event"], .type)
'''

# ---------- Sink: MQTT to AWS IoT Core ----------
# NOTE: @@AWS_IOT_ENDPOINT@@ and @@ROOTED_DEVICE_ID@@ are placeholders that the
# deploy scripts substitute with real values at deploy time (sed). We do NOT use
# Vector's ${ENV_VAR} interpolation here: the Vector build we ship (musl static,
# installed via sh.vector.dev) does not interpolate environment variables, so a
# ${VAR} reference is sent to DNS literally and the MQTT connection times out.
[sinks.mqtt_iot]
type = "mqtt"
inputs = ["filter_valid"]
host = "@@AWS_IOT_ENDPOINT@@"
port = 8883
topic = "rooted/machines/@@ROOTED_DEVICE_ID@@/telemetry"
# Unique, non-empty client id (command_handler.py connects as the bare device id;
# the -vector suffix avoids AWS IoT kicking one connection for a duplicate id).
client_id = "@@ROOTED_DEVICE_ID@@-vector"
encoding.codec = "json"
quality_of_service = "atleastonce"

# TLS mutual auth (X.509 certs provisioned by provision-iot-device.sh)
tls.enabled = true
tls.ca_file = "/opt/rooted-ble/certs/AmazonRootCA1.pem"
tls.crt_file = "/opt/rooted-ble/certs/certificate.pem.crt"
tls.key_file = "/opt/rooted-ble/certs/private.pem.key"

# Batching: up to 50 events or 30s, whichever comes first
batch.max_events = 50
batch.timeout_secs = 30

# Disk buffer for resilience across reboots / connectivity drops
buffer.type = "disk"
buffer.max_size = 268435488  # ~256 MB (Vector minimum for disk buffer)
buffer.when_full = "block"
