services:
  postgres:
    image: postgres:16-alpine
    container_name: rooted-postgres
    environment:
      POSTGRES_USER: rooted
      POSTGRES_PASSWORD: rooted_dev_password
      POSTGRES_DB: rooted_planner
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rooted -d rooted_planner"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rooted-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rooted-api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: rooted-api
    ports:
      - "8001:8000"
    env_file:
      - ../.env
    environment:
      NODE_ENV: development
      PORT: 8000
      DATABASE_URL: postgresql://rooted:rooted_dev_password@postgres:5432/rooted_planner
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
